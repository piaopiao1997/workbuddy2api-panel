services:
  wb2api:
    build: .
    # ★ 部署事实（当前镜像 tag）放 .env，不进仓库：升级只改 .env 一行
    image: workbuddy2api-panel-wb2api:${WB2API_TAG:?WB2API_TAG 未设置（见 .env）}
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行；改成 1000 是为了让数据目录（属主 ubuntu=1000）可写。
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    # 上游 ENTRYPOINT 写死 -config /app/config.json，这里覆盖成 /app/data/config.json
    # （面板「保存设置」要在同目录写 tmp 再 rename，/app 是镜像层不可写）。
    entrypoint: ["/app/wb2api", "-config", "/app/data/config.json"]
    volumes:
      # ★ 数据目录（10-19 由 workbuddy2api-panel 改名而来），auths / state.json 连续；回滚读同一份
      - ${WB2API_DATA:?WB2API_DATA 未设置（见 .env）}/auths:/app/auths
      - ${WB2API_DATA:?WB2API_DATA 未设置（见 .env）}/data:/app/data
      - ${WB2API_DATA:?WB2API_DATA 未设置（见 .env）}/config.json:/app/data/config.json
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
